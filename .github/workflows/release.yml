name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build backend sidecar
        run: |
          $settingsPath = 'PosWeb\appsettings.json'
          $settings = Get-Content $settingsPath -Raw | ConvertFrom-Json
          if (-not $settings.RemoteAccess) {
            $settings | Add-Member -NotePropertyName RemoteAccess -NotePropertyValue ([pscustomobject]@{})
          }
          $settings.RemoteAccess | Add-Member -Force -NotePropertyName WorkerUrl -NotePropertyValue $env:REMOTE_ACCESS_WORKER_URL
          $settings.RemoteAccess | Add-Member -Force -NotePropertyName InternalKey -NotePropertyValue $env:REMOTE_ACCESS_INTERNAL_KEY
          $settings | ConvertTo-Json -Depth 20 | Set-Content $settingsPath -Encoding UTF8
          dotnet publish PosWeb/PosWeb.csproj -c Release -r win-x64 --self-contained true -o publish

          $publishedBinary = [System.Text.Encoding]::UTF8.GetString([System.IO.File]::ReadAllBytes((Resolve-Path 'publish\PosWeb.exe')))
          foreach ($secret in @{
            WorkerUrl = $env:REMOTE_ACCESS_WORKER_URL
            InternalKey = $env:REMOTE_ACCESS_INTERNAL_KEY
          }.GetEnumerator()) {
            if (-not [string]::IsNullOrWhiteSpace($secret.Value) -and $publishedBinary.IndexOf($secret.Value, [System.StringComparison]::Ordinal) -lt 0) {
              throw "Embedded RemoteAccess $($secret.Key) does not match the configured secret"
            }
          }

          New-Item -ItemType Directory -Force -Path frontend\src-tauri\binaries
          Copy-Item publish\PosWeb.exe frontend\src-tauri\binaries\posweb-backend-x86_64-pc-windows-msvc.exe
        env:
          REMOTE_ACCESS_WORKER_URL: ${{ secrets.REMOTE_ACCESS_WORKER_URL }}
          REMOTE_ACCESS_INTERNAL_KEY: ${{ secrets.REMOTE_ACCESS_INTERNAL_KEY }}

      - name: Build Vendeto Mobile sidecar
        run: |
          python -m pip install -r mobile-client\requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --name vendeto-mobile --add-data "mobile-client\static;static" --distpath frontend\src-tauri\binaries --workpath mobile-client\build --specpath mobile-client mobile-client\server.py
          Move-Item frontend\src-tauri\binaries\vendeto-mobile.exe frontend\src-tauri\binaries\vendeto-mobile-x86_64-pc-windows-msvc.exe

      - name: Download verified cloudflared sidecar
        shell: pwsh
        run: |
          $version = '2026.10.0'
          $expectedHash = '86aee4017b26625cee8484c113558f48effa4cd47f7aa05fcf425604e5d2b23c'
          $target = 'frontend\src-tauri\binaries\vendeto-cloudflared-x86_64-pc-windows-msvc.exe'
          Invoke-WebRequest "https://github.com/cloudflare/cloudflared/releases/download/$version/cloudflared-windows-amd64.exe" -OutFile $target
          if ((Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expectedHash) {
            Remove-Item $target -Force
            throw 'cloudflared checksum verification failed'
          }

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build Tauri
        run: npm run tauri build
        working-directory: frontend
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/nsis/*.nsis.zip

      - name: Update latest.json for auto-updater
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''

          $exeFile = Get-ChildItem "frontend/src-tauri/target/release/bundle/nsis/*_x64-setup.exe" | Select-Object -First 1
          if (-not $exeFile) {
            Write-Error "NSIS installer not found"
            exit 1
          }
          $exeName = $exeFile.Name
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/${tag}/${exeName}"

          # Read signature from .sig file generated by Tauri build
          $sigFile = "$($exeFile.FullName).sig"
          if (Test-Path $sigFile) {
            Write-Host "Reading signature from $sigFile"
            $signature = Get-Content $sigFile -Raw
          } else {
            Write-Error "Signature file not found: $sigFile"
            exit 1
          }
          Write-Host "Signature: $signature"

          $latest = @{
            version  = $version
            notes    = "Release v${version}"
            pub_date = (Get-Date -AsUTC).ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                url       = $downloadUrl
                signature = $signature.Trim()
              }
            }
          }

          $latest | ConvertTo-Json -Depth 4 | Set-Content latest.json -Encoding UTF8
          Write-Host "Generated latest.json:"
          Get-Content latest.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          $tmp = New-TemporaryFile
          Copy-Item latest.json $tmp
          git fetch origin master
          git reset --hard origin/master
          Copy-Item $tmp latest.json
          Remove-Item $tmp
          git add latest.json
          git commit -m "chore: update latest.json to v${version}" --allow-empty
          git push origin HEAD:master
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_PRIVATE_KEY_PASSWORD }}

      - name: Attach latest.json to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            latest.json
