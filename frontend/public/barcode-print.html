<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Imprimir códigos de barras</title>
  <style>
    @page { margin: 0; }
    html, body { margin: 0; padding: 0; font-family: Arial, sans-serif; color: #000; }
    .label { box-sizing: border-box; padding: 3mm; border: .2mm solid #000; }
    .barcode { width: 100%; }
    .barcode svg { display: block; width: 100%; height: auto; }
    .barcode-code { margin: 1mm 0 0; font-family: monospace; font-size: 14px; letter-spacing: 1px; text-align: center; }
  </style>
</head>
<body>
  <main id="labels"></main>
  <script>
    const closePrintWindow = async () => {
      const invoke = window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke
      if (invoke) await invoke('cerrar_ventana_impresion')
      else window.close()
    }
    const data = JSON.parse(localStorage.getItem('posweb-barcode-print') || 'null')
    if (!data) closePrintWindow()
    else {
      const ancho = data.ancho === 58 ? 58 : 80
      const printStyle = document.createElement('style')
      printStyle.textContent = `@page { size: ${ancho}mm auto; margin: 0; } html, body { width: ${ancho}mm; } .label { width: ${ancho}mm; min-height: 35mm; }`
      document.head.appendChild(printStyle)
      const labels = document.getElementById('labels')
      for (let index = 0; index < data.cantidad; index += 1) {
        const label = document.createElement('article')
        label.className = 'label'
        const barcode = document.createElement('div')
        barcode.className = 'barcode'
        barcode.innerHTML = data.svg
        const code = document.createElement('p')
        code.className = 'barcode-code'
        code.textContent = data.codigo
        label.append(barcode, code)
        labels.appendChild(label)
      }
      setTimeout(async () => {
        window.print()
        await closePrintWindow()
      }, 100)
    }
  </script>
</body>
</html>
